[package]
name = "makruk-tb"
version = "0.1.0"
edition = "2021"
description = "Makruk endgame tables: build (retrograde, all threads) and check against the site's tables"
publish = false

[dependencies]
rayon = "1.10"
flate2 = "1.0"
serde_json = "1.0"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
