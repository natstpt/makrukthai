name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Makruk rules and lesson positions
        run: node tests/makruk-rules.test.cjs

      - name: Verify move notation
        run: node tests/makruk-notation.test.cjs

      - name: Verify rules curriculum and source references
        run: node tests/rules-lessons.test.cjs

      - name: Verify reachable multi-move puzzles
        run: node tests/learning-design.test.cjs

      - name: Verify multi-move star awards
        run: node tests/puzzle-flow.test.cjs

      - name: Verify endgame mates
        run: node tests/endgame-lessons.test.cjs

      - name: Verify endgame puzzles
        run: node tests/endgame-puzzles.test.cjs

      - name: Verify endgame chases
        run: node tests/endgame-chases.test.cjs

      - name: Verify step-by-step teaching boards
        run: node tests/teaching-steps.test.cjs

      - name: Verify counting and the computer player
        run: node tests/makruk-play.test.cjs

      - name: Verify hard AI engine files
        run: node tests/engine-files.test.cjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
